map $request_method $timeline_post_limit_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $timeline_post_limit_key zone=timeline_post_limit:10m rate=1r/m;

server {
    listen 80;
    listen [::]:80;
    server_name yuezhen-dong-b4-week2.duckdns.org;

    location /.well-known/acme-challenge {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yuezhen-dong-b4-week2.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/yuezhen-dong-b4-week2.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuezhen-dong-b4-week2.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yuezhen-dong-b4-week2.duckdns.org/chain.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    location = /api/timeline_post {
        limit_req zone=timeline_post_limit;
        proxy_pass http://myportfolio:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://myportfolio:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
