version: "3"

services:
  myportfolio:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      FLASK_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - .:/myportfolio
    depends_on:
      - mysql

  mysql:
    image: mariadb:10.5
    restart: always
    env_file:
      - .env
    volumes:
      - mydatabase:/var/lib/mysql

volumes:
  mydatabase:
