<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta property="og:title" content="{{ title }} | Lily Dong">
    <meta property="og:description" content="Portfolio site for Lily Dong">
    <meta property="og:url" content="{{ url }}">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">
    <title>{{ title }} | Lily Dong</title>
</head>

<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}" aria-label="Lily Dong home">
            <span class="brand-mark">LD</span>
            <span class="brand-name">Lily Dong</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
            {% for item in nav_items %}
            <a
                href="{{ url_for(item.endpoint) }}{% if item.fragment is defined %}#{{ item.fragment }}{% endif %}"
                class="{% if request.endpoint == item.endpoint and item.fragment is not defined %}active{% endif %}"
            >
                {{ item.label }}
            </a>
            {% endfor %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>

</html>
